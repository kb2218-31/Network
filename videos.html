<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制作した動画作品-p2</title>
<style>
:root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-alt: #f8f8f8;
    --line: #d9d9d9;
    --text: #1d1d1d;
    --muted: #5f6470;
    --primary: #3b5f93;
    --primary-dark: #2d4f7a;
    --accent: #f2f5fb;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: #ffffff;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    color: var(--text);
    line-height: 1.7;
}

.container {
    max-width: 980px;
    margin: 12px 0 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: visible;
}

header {
    padding: 28px 18px 18px;
    background: #ffffff;
}

h1, h2, h3 {
    margin: 0;
    color: var(--text);
}

header h1 {
    font-size: clamp(2rem, 4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 0.04em;
}

.subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1.02rem;
}

.line {
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--line) 10%, var(--line) 90%, transparent 100%);
}

.content {
    padding: 30px;
}

section {
    margin-top: 24px;
}

section h2 {
    color: var(--primary);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 16px;
    font-size: 1.4rem;
}

.intro {
    margin: 0 0 18px;
    color: var(--muted);
}

.work {
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 18px 16px;
    margin-bottom: 18px;
    background: #fafafa;
    box-shadow: none;
}

.work strong {
    display: inline-block;
    font-size: 1.08rem;
    margin-bottom: 8px;
}

.meta {
    color: var(--muted);
    font-size: 0.96rem;
    margin-bottom: 14px;
}

.video-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--line);
    border-radius: 0;
    display: block;
    margin: 8px 0 16px;
    background: #000;
}

.back {
    margin-top: 20px;
}

a {
    color: var(--primary);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

footer {
    text-align: center;
    padding: 22px 30px 30px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    background: #fbfcff;
}

@media (max-width: 600px) {
    .container {
        margin: 10px 0 14px;
    }

    header,
    .content {
        padding-left: 14px;
        padding-right: 14px;
    }

    header {
        padding-top: 22px;
    }
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>制作した動画作品</h1>
<div class="subtitle">過去に制作した動画作品の一部を紹介しています。</div>
</header>

<div class="line"></div>
<div class="content">
<section>
<p class="intro">
このページでは、過去に制作した動画作品の一部を紹介しています。<br>
原曲、歌詞等の著作権は各権利者様に帰属します。
 </p>
</section>

</section>

</body>
</html>
